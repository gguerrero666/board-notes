name: CI

# Ejecuta los tests en cada push y en cada pull request.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Si llega un push nuevo a la misma rama, cancela la ejecución anterior que sigue en curso.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Descarga Gradle y guarda en caché las dependencias entre ejecuciones
      - uses: gradle/actions/setup-gradle@v4

      # Los tests usan una base H2 en memoria: no necesitan ningún servicio externo
      - name: Ejecutar los tests
        run: ./gradlew test --no-daemon

      - name: Guardar el informe de tests si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests-backend
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: Frontend (lint, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Análisis estático
        run: npm run lint

      - name: Ejecutar los tests
        run: npm test

      - name: Compilar
        run: npm run build
