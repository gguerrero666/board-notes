# Board de notas: backend (Spring Boot + H2) y frontend (nginx con el build de Vite)
name: board

services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - data:/app/data   # archivo de la base H2: aquí viven las notas
    # No se publica ningún puerto: solo nginx lo alcanza, por la red interna

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"   # http://localhost/ (otro puerto: HTTP_PORT=8081 docker compose up -d)

volumes:
  data:
